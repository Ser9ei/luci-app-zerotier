name: "Build OpenWrt Package"

on:
  push:
    branches: [ "master" ]
    paths:
      - 'htdocs/**'
      - 'root/**'
      - 'Makefile'
      - 'po/**'

  workflow_dispatch:
    inputs:
      mode:
        description: "Select build mode: normal or fast (skip ZeroTier build dependency)"
        required: true
        default: normal
        type: choice
        options:
          - normal
          - fast
      openwrt_version:
        description: "Choose OpenWrt version"
        required: true
        default: last
        type: choice
        options:
          - last
          - all

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      mode: ${{ steps.set.outputs.mode }}
    steps:
      - name: Set matrix and mode
        id: set
        env:
          SDK_VERSIONS: ${{ vars.CI_OPENWRT_SDK_VERSIONS }}
          RELEASE: ${{ vars.CI_OPENWRT_RELEASE }}
        run: |
          set -euo pipefail

          if [ -z "${SDK_VERSIONS// }" ]; then
            echo "::warning::CI_OPENWRT_SDK_VERSIONS is empty — fallback to SNAPSHOT only"
            VERSIONS=(SNAPSHOT)
          else
            # shellcheck disable=SC2206
            VERSIONS=($SDK_VERSIONS)
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            SELECTED="last"
            MODE="fast"
          else
            SELECTED="${{ inputs.openwrt_version }}"
            MODE="${{ inputs.mode }}"
          fi

          build_entry() {
            local full="$1"
            local line="${full%.*}"
            if [ "$full" = "SNAPSHOT" ]; then
              line="SNAPSHOT"
            fi
            echo "{\"version\":\"${line}\",\"sdk\":\"${full}\",\"target\":\"x86_64\",\"suffix\":\"all\"}"
          }

          if [ "$SELECTED" = "all" ]; then
            parts=()
            for v in "${VERSIONS[@]}"; do
              parts+=("$(build_entry "$v")")
            done
            MATRIX="{\"include\":[$(IFS=,; echo "${parts[*]}")]}"
          elif [ "$SELECTED" = "last" ]; then
            if [ -z "${RELEASE// }" ]; then
              echo "::error::CI_OPENWRT_RELEASE is empty" >&2
              exit 1
            fi

            LAST=""
            for v in "${VERSIONS[@]}"; do
              line="${v%.*}"
              if [ "$v" = "SNAPSHOT" ]; then
                line="SNAPSHOT"
              fi
              if [ "$line" = "$RELEASE" ] || [ "$v" = "$RELEASE" ]; then
                LAST="$v"
              fi
            done

            if [ -z "$LAST" ]; then
              echo "::error::No SDK pin for CI_OPENWRT_RELEASE=${RELEASE} in CI_OPENWRT_SDK_VERSIONS" >&2
              exit 1
            fi

            MATRIX="{\"include\":[$(build_entry "$LAST")]}"
          else
            echo "Unsupported selection: $SELECTED" >&2
            exit 1
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE matrix=$MATRIX"

  build:
    name: Build ${{ matrix.version }} (${{ matrix.sdk }})
    needs: prepare
    runs-on: ubuntu-latest
    env:
      PKG_NAME: luci-app-zerotier
      DEBUG_PACKAGES: "0"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up LuCI feed structure
        run: |
          set -euo pipefail
          mkdir -p package
          printf 'include $(TOPDIR)/feeds/luci/luci.mk\n' > package/luci.mk
          mkdir -p "feed/luci/applications/${PKG_NAME}"
          mkdir -p feed/luci
          printf 'include $(TOPDIR)/feeds/luci/luci.mk\n' > feed/luci/luci.mk
          rsync -av \
            --exclude='.git' \
            --exclude='feed' \
            --exclude='.github' \
            ./ "feed/luci/applications/${PKG_NAME}/"

      - name: Patch Makefile for fast build
        if: needs.prepare.outputs.mode == 'fast'
        run: |
          set -euo pipefail
          MF="feed/luci/applications/${PKG_NAME}/Makefile"
          if grep -qE '^LUCI_DEPENDS[[:space:]]*[:?+]*=' "$MF"; then
            sed -i '/^LUCI_DEPENDS[[:space:]]*[:?+]*=/d' "$MF"
            echo "fast: removed LUCI_DEPENDS"
          else
            echo "::warning::fast mode: expected LUCI_DEPENDS in Makefile, but none found — dependency not stripped"
          fi

      - name: Compute ARCH
        run: |
          echo "ARCH=${{ matrix.target }}-${{ matrix.sdk }}" >> "$GITHUB_ENV"
          echo "Using ARCH=${{ matrix.target }}-${{ matrix.sdk }}"

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@v8
        env:
          ARCH: ${{ env.ARCH }}
          FEEDNAME: zerotier
          PACKAGES: ${{ env.PKG_NAME }}
          INDEX: 0
          FEED_DIR: ${{ github.workspace }}/feed
          NO_SHFMT_CHECK: 1
          NO_REFRESH_CHECK: 1

      - name: Debug packages tree
        if: env.DEBUG_PACKAGES == '1'
        run: |
          find bin -type f \( -name '*.ipk' -o -name '*.apk' \) 2>/dev/null | head -100 || true
          ls -laR bin/packages 2>/dev/null | head -200 || true

      - name: Collect and rename packages
        run: |
          set -euo pipefail
          PKG_VERSION=$(grep -E '^PKG_VERSION *:?=' Makefile | head -n1 | cut -d= -f2 | tr -d '[:space:]')
          PKG_RELEASE=$(grep -E '^PKG_RELEASE *:?=' Makefile | head -n1 | cut -d= -f2 | tr -d '[:space:]')
          mkdir -p upload
          for ext in ipk apk; do
            case "$ext" in
              apk) REL="r${PKG_RELEASE}" ;;
              *)   REL="${PKG_RELEASE}" ;;
            esac
            while IFS= read -r -d '' f; do
              base=$(basename "$f")
              case "$base" in
                luci-app-zerotier*|luci-i18n-zerotier*)
                  if [[ "$base" == luci-app-zerotier* ]]; then
                    out="${PKG_NAME}-${PKG_VERSION}-${REL}_${{ matrix.version }}_${{ matrix.suffix }}.${ext}"
                  else
                    out="${base%.*}_${{ matrix.version }}.${ext}"
                  fi
                  cp -a "$f" "upload/$out"
                  echo "collected $out"
                  ;;
              esac
            done < <(
              find bin/packages -type f -name "*.${ext}" -print0 2>/dev/null || true
            )
          done
          ls -la upload
          test -n "$(ls -A upload 2>/dev/null)"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG_NAME }}-${{ matrix.version }}
          path: upload/*
          if-no-files-found: error
          retention-days: 3
