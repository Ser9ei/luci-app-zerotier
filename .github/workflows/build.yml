name: "Build OpenWrt Package"

on:
  push:
    branches: [ "master" ]
    paths:
      - 'htdocs/**'
      - 'root/**'
      - 'Makefile'
      - 'po/**'

  pull_request:
    branches: [ "master" ]
    paths:
      - 'htdocs/**'
      - 'root/**'
      - 'Makefile'
      - 'po/**'

  workflow_dispatch:
    inputs:
      mode:
        description: "Select build mode: normal or fast (skip functional package build dependency)"
        required: true
        default: normal
        type: choice
        options:
          - normal
          - fast
      openwrt_version:
        description: "Choose OpenWrt version"
        required: true
        default: last
        type: choice
        options:
          - last
          - all

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      mode: ${{ steps.set.outputs.mode }}
    steps:
      - name: Set matrix and mode
        id: set
        env:
          SDK_VERSIONS: ${{ vars.CI_OPENWRT_SDK_VERSIONS }}
          RELEASE: ${{ vars.CI_OPENWRT_RELEASE }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_OPENWRT_VERSION: ${{ inputs.openwrt_version }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          if [ -z "${SDK_VERSIONS// }" ]; then
            echo "::warning::CI_OPENWRT_SDK_VERSIONS is empty — fallback to SNAPSHOT only"
            VERSIONS=(SNAPSHOT)
          else
            # shellcheck disable=SC2206
            VERSIONS=($SDK_VERSIONS)
          fi

          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "pull_request" ]; then
            SELECTED="last"
            MODE="fast"
          else
            SELECTED="$INPUT_OPENWRT_VERSION"
            MODE="$INPUT_MODE"
          fi

          build_entry() {
            local full="$1"
            local line="${full%.*}"
            if [ "$full" = "SNAPSHOT" ]; then
              line="SNAPSHOT"
            fi
            echo "{\"version\":\"${line}\",\"sdk\":\"${full}\",\"target\":\"x86_64\",\"suffix\":\"all\"}"
          }

          if [ "$SELECTED" = "all" ]; then
            parts=()
            for v in "${VERSIONS[@]}"; do
              parts+=("$(build_entry "$v")")
            done
            MATRIX="{\"include\":[$(IFS=,; echo "${parts[*]}")]}"
          elif [ "$SELECTED" = "last" ]; then
            if [ -z "${RELEASE// }" ]; then
              echo "::error::CI_OPENWRT_RELEASE is empty" >&2
              exit 1
            fi

            LAST=""
            for v in "${VERSIONS[@]}"; do
              line="${v%.*}"
              if [ "$v" = "SNAPSHOT" ]; then
                line="SNAPSHOT"
              fi
              if [ "$line" = "$RELEASE" ] || [ "$v" = "$RELEASE" ]; then
                LAST="$v"
              fi
            done

            if [ -z "$LAST" ]; then
              echo "::error::No SDK pin for CI_OPENWRT_RELEASE=${RELEASE} in CI_OPENWRT_SDK_VERSIONS" >&2
              exit 1
            fi

            MATRIX="{\"include\":[$(build_entry "$LAST")]}"
          else
            echo "Unsupported selection: $SELECTED" >&2
            exit 1
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE matrix=$MATRIX"

  build:
    name: Build ${{ matrix.version }} (${{ matrix.sdk }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Validate package variables
        env:
          CI_PACKAGE_NAME: ${{ vars.CI_PACKAGE_NAME }}
          CI_PACKAGE_DIR: ${{ vars.CI_PACKAGE_DIR }}
          CI_PACKAGE_I18N_PREFIX: ${{ vars.CI_PACKAGE_I18N_PREFIX }}
        run: |
          set -euo pipefail

          name="${CI_PACKAGE_NAME:-}"
          dir="${CI_PACKAGE_DIR:-}"
          dir="${dir%/}"
          prefix="${CI_PACKAGE_I18N_PREFIX:-}"

          fail=0
          comp='[A-Za-z0-9][A-Za-z0-9._-]*'
          check() {
            local kind="$1" label="$2" value="$3" re
            if [ "$kind" = path ]; then re="^${comp}(/${comp})*$"; else re="^${comp}$"; fi
            if [ -z "$value" ]; then
              echo "::error::GitHub Actions variable ${label} is not set."
              fail=1
            elif ! [[ "$value" =~ $re ]]; then
              echo "::error::Variable ${label} must be a relative ${kind} of letters, digits, '.', '_', '-' (got '${value}')."
              fail=1
            fi
          }
          check name CI_PACKAGE_NAME "$name"
          check path CI_PACKAGE_DIR "$dir"
          check name CI_PACKAGE_I18N_PREFIX "$prefix"
          [ "$fail" -eq 0 ] || exit 1

          dir="${dir%/}"
          if [ "$(basename "$dir")" != "$name" ]; then
            dir="${dir}/${name}"
          fi

          {
            echo "PKG_NAME=${name}"
            echo "PKG_DIR=${dir}"
            echo "I18N_PREFIX=${prefix}"
          } >> "$GITHUB_ENV"

          echo "PKG_NAME=${name} PKG_DIR=${dir} I18N_PREFIX=${prefix}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up LuCI feed structure
        run: |
          set -euo pipefail
          mkdir -p package
          printf 'include $(TOPDIR)/feeds/luci/luci.mk\n' > package/luci.mk
          mkdir -p "feed/luci/${PKG_DIR}"
          printf 'include $(TOPDIR)/feeds/luci/luci.mk\n' > feed/luci/luci.mk
          rsync -av \
            --exclude='.git' \
            --exclude='feed' \
            --exclude='.github' \
            ./ "feed/luci/${PKG_DIR}/"

      - name: Patch Makefile for fast build
        if: needs.prepare.outputs.mode == 'fast'
        run: |
          set -euo pipefail
          MF="feed/luci/${PKG_DIR}/Makefile"
          if grep -qE '^LUCI_DEPENDS[[:space:]]*[:?+]*=' "$MF"; then
            sed -i '/^LUCI_DEPENDS[[:space:]]*[:?+]*=/d' "$MF"
            echo "fast: removed LUCI_DEPENDS"
          else
            echo "::warning::fast mode: expected LUCI_DEPENDS in Makefile, but none found — dependency not stripped"
          fi

      - name: Compute ARCH
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_SDK: ${{ matrix.sdk }}
        run: |
          echo "ARCH=${MATRIX_TARGET}-${MATRIX_SDK}" >> "$GITHUB_ENV"
          echo "Using ARCH=${MATRIX_TARGET}-${MATRIX_SDK}"

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@7fc2640243284ecc44f4a9c3f749a61746ee02cb # v11
        env:
          ARCH: ${{ env.ARCH }}
          FEEDNAME: ${{ env.PKG_NAME }}
          PACKAGES: ${{ env.PKG_NAME }}
          INDEX: 0
          FEED_DIR: ${{ github.workspace }}/feed
          NO_SHFMT_CHECK: 1
          NO_REFRESH_CHECK: 1

      - name: Collect and rename packages
        env:
          MATRIX_VERSION: ${{ matrix.version }}
          MATRIX_SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          PKG_VERSION=$(grep -E '^PKG_VERSION *:?=' Makefile | head -n1 | cut -d= -f2 | tr -d '[:space:]')
          PKG_RELEASE=$(grep -E '^PKG_RELEASE *:?=' Makefile | head -n1 | cut -d= -f2 | tr -d '[:space:]')
          mkdir -p upload
          for ext in ipk apk; do
            case "$ext" in
              apk) REL="r${PKG_RELEASE}" ;;
              *)   REL="${PKG_RELEASE}" ;;
            esac
            while IFS= read -r -d '' f; do
              base=$(basename "$f")
              case "$base" in
                "${PKG_NAME}"*|"luci-i18n-${I18N_PREFIX}"*)
                  if [[ "$base" == "${PKG_NAME}"* ]]; then
                    out="${PKG_NAME}-${PKG_VERSION}-${REL}_${MATRIX_VERSION}_${MATRIX_SUFFIX}.${ext}"
                  else
                    out="${base%.*}_${MATRIX_VERSION}.${ext}"
                  fi
                  cp -a "$f" "upload/$out"
                  echo "collected $out"
                  ;;
              esac
            done < <(
              find bin/packages -type f -name "*.${ext}" -print0 2>/dev/null || true
            )
          done
          ls -la upload
          test -n "$(ls -A upload 2>/dev/null)"

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ env.PKG_NAME }}-${{ matrix.version }}
          path: upload/*
          if-no-files-found: error
          retention-days: 3
