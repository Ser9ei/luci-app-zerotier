name: "Build OpenWrt Package"

on:
  push:
    branches: [ "master" ]
    paths:
      - 'htdocs/**'
      - 'root/**'
      - 'Makefile'
      - 'po/**'

  pull_request:
    branches: [ "master" ]
    paths:
      - 'htdocs/**'
      - 'root/**'
      - 'Makefile'
      - 'po/**'

  workflow_dispatch:
    inputs:
      mode:
        description: "Select build mode: normal or fast (skip functional package build dependency)"
        required: true
        default: fast
        type: choice
        options:
          - normal
          - fast
      openwrt_version:
        description: "Choose OpenWrt version"
        required: true
        default: last
        type: choice
        options:
          - last
          - all

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      mode: ${{ steps.set.outputs.mode }}
    steps:
      - name: Set matrix and mode
        id: set
        env:
          SDK_VERSIONS: ${{ vars.CI_OPENWRT_SDK_VERSIONS }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_OPENWRT_VERSION: ${{ inputs.openwrt_version }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          if [ -z "${SDK_VERSIONS// }" ]; then
            echo "::warning::CI_OPENWRT_SDK_VERSIONS is empty — fallback to SNAPSHOT only"
            VERSIONS=(SNAPSHOT)
          else
            # shellcheck disable=SC2206
            VERSIONS=($SDK_VERSIONS)
          fi

          # Entries are interpolated into JSON below: allow only x.y.z or SNAPSHOT.
          for v in "${VERSIONS[@]}"; do
            if ! [[ "$v" =~ ^([0-9]+\.[0-9]+\.[0-9]+|SNAPSHOT)$ ]]; then
              echo "::error::Invalid entry '${v}' in CI_OPENWRT_SDK_VERSIONS (expected e.g. 25.12.5 or SNAPSHOT)." >&2
              exit 1
            fi
          done

          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "pull_request" ]; then
            SELECTED="last"
            MODE="fast"
          else
            SELECTED="$INPUT_OPENWRT_VERSION"
            MODE="$INPUT_MODE"
          fi

          build_entry() {
            local full="$1"
            local line="${full%.*}"
            if [ "$full" = "SNAPSHOT" ]; then
              line="SNAPSHOT"
            fi
            echo "{\"version\":\"${line}\",\"sdk\":\"${full}\",\"target\":\"x86_64\",\"suffix\":\"all\"}"
          }

          if [ "$SELECTED" = "all" ]; then
            parts=()
            for v in "${VERSIONS[@]}"; do
              parts+=("$(build_entry "$v")")
            done
            MATRIX="{\"include\":[$(IFS=,; echo "${parts[*]}")]}"
          elif [ "$SELECTED" = "last" ]; then
            # "last" = the newest numbered release in the list (version sort,
            # list order does not matter); SNAPSHOT only if nothing else is listed.
            LAST="$(printf '%s\n' "${VERSIONS[@]}" | { grep -v '^SNAPSHOT$' || true; } | sort -V | tail -n1)"
            LAST="${LAST:-SNAPSHOT}"

            MATRIX="{\"include\":[$(build_entry "$LAST")]}"
          else
            echo "Unsupported selection: $SELECTED" >&2
            exit 1
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE matrix=$MATRIX"

  build:
    name: Build ${{ matrix.version }} (${{ matrix.sdk }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Validate package variables
        env:
          CI_PACKAGE: ${{ vars.CI_PACKAGE }}
          CI_PACKAGE_PREFIX: ${{ vars.CI_PACKAGE_PREFIX }}
        run: |
          set -euo pipefail

          pkg="${CI_PACKAGE:-}"
          prefix="${CI_PACKAGE_PREFIX:-}"

          fail=0
          if [ -z "$pkg" ]; then
            echo "::error::GitHub Actions variable CI_PACKAGE is not set (e.g. zerotier)."
            fail=1
          elif ! [[ "$pkg" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "::error::CI_PACKAGE must be lowercase letters, digits, '.', '_', '-' (got '${pkg}')."
            fail=1
          fi

          # The prefix selects the directory in the openwrt/luci tree.
          # Add new package types here (and only here) when they appear.
          case "$prefix" in
            luci-app)   category="applications" ;;
            luci-proto) category="protocols" ;;
            luci-theme) category="themes" ;;
            luci-mod)   category="modules" ;;
            luci-lib)   category="libs" ;;
            "")
              echo "::error::GitHub Actions variable CI_PACKAGE_PREFIX is not set (e.g. luci-app)."
              fail=1
              ;;
            *)
              echo "::error::Unsupported CI_PACKAGE_PREFIX '${prefix}' (supported: luci-app, luci-proto, luci-theme, luci-mod, luci-lib)."
              fail=1
              ;;
          esac
          [ "$fail" -eq 0 ] || exit 1

          # luci.mk names the translation package luci-i18n-<pkg>-<lang>
          # and the template po/templates/<pkg>.pot.
          name="${prefix}-${pkg}"
          dir="${category}/${name}"
          i18n="${pkg}"

          {
            echo "PKG_NAME=${name}"
            echo "PKG_DIR=${dir}"
            echo "I18N_PREFIX=${i18n}"
          } >> "$GITHUB_ENV"

          echo "PKG_NAME=${name} PKG_DIR=${dir} I18N_PREFIX=${i18n}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up LuCI feed structure
        run: |
          set -euo pipefail
          mkdir -p "feed/luci/${PKG_DIR}"
          printf 'include $(TOPDIR)/feeds/luci/luci.mk\n' > feed/luci/luci.mk
          rsync -av \
            --exclude='.git' \
            --exclude='feed' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            ./ "feed/luci/${PKG_DIR}/"

      - name: Patch Makefile for fast build
        if: needs.prepare.outputs.mode == 'fast'
        run: |
          set -euo pipefail

          MF="feed/luci/${PKG_DIR}/Makefile"

          if grep -qE '^LUCI_DEPENDS[[:space:]]*[:?+]*=' "$MF"; then
            awk '
              /^LUCI_DEPENDS[[:space:]]*[:?+]*=/ {
                skip = /\\[[:space:]]*$/
                next
              }

              skip {
                skip = /\\[[:space:]]*$/
                next
              }

              { print }
            ' "$MF" > "${MF}.tmp"

            mv "${MF}.tmp" "$MF"

            echo "fast: removed complete LUCI_DEPENDS assignment"
          else
            echo "::warning::fast mode: expected LUCI_DEPENDS in Makefile, but none found — dependency not stripped"
          fi

      - name: Compute ARCH
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_SDK: ${{ matrix.sdk }}
        run: |
          echo "ARCH=${MATRIX_TARGET}-${MATRIX_SDK}" >> "$GITHUB_ENV"
          echo "Using ARCH=${MATRIX_TARGET}-${MATRIX_SDK}"

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@7fc2640243284ecc44f4a9c3f749a61746ee02cb # v11
        env:
          ARCH: ${{ env.ARCH }}
          FEEDNAME: local
          PACKAGES: ${{ env.PKG_NAME }}
          INDEX: 0
          FEED_DIR: ${{ github.workspace }}/feed
          NO_SHFMT_CHECK: 1
          NO_REFRESH_CHECK: 1

      - name: Collect and rename packages
        env:
          MATRIX_VERSION: ${{ matrix.version }}
          MATRIX_SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          PKG_VERSION=$(grep -E '^PKG_VERSION *:?=' Makefile | head -n1 | cut -d= -f2 | tr -d '[:space:]')
          PKG_RELEASE=$(grep -E '^PKG_RELEASE *:?=' Makefile | head -n1 | cut -d= -f2 | tr -d '[:space:]')
          mkdir -p upload
          for ext in ipk apk; do
            case "$ext" in
              apk) REL="r${PKG_RELEASE}" ;;
              *)   REL="${PKG_RELEASE}" ;;
            esac
            while IFS= read -r -d '' f; do
              base=$(basename "$f")
              case "$base" in
                "${PKG_NAME}"*|"luci-i18n-${I18N_PREFIX}"*)
                  if [[ "$base" == "${PKG_NAME}"* ]]; then
                    out="${PKG_NAME}-${PKG_VERSION}-${REL}_${MATRIX_VERSION}_${MATRIX_SUFFIX}.${ext}"
                  else
                    out="${base%.*}_${MATRIX_VERSION}.${ext}"
                  fi
                  cp -a "$f" "upload/$out"
                  echo "collected $out"
                  ;;
              esac
            done < <(
              find bin/packages -type f -name "*.${ext}" -print0 2>/dev/null || true
            )
          done
          ls -la upload
          test -n "$(ls -A upload 2>/dev/null)"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PKG_NAME }}-${{ matrix.version }}
          path: upload/*
          if-no-files-found: error
          retention-days: 3

      - name: Job summary
        if: always()
        run: |
          set -euo pipefail
          STATUS="${{ job.status }}"
          case "$STATUS" in
            success) ICON="✅" ;;
            failure) ICON="❌" ;;
            cancelled) ICON="⚠️" ;;
            *) ICON="•" ;;
          esac

          {
            echo "## Build ${{ matrix.version }}"
            echo
            echo "${ICON} **Result:** \`${STATUS}\`"
            echo
            echo "- **SDK pin:** \`${{ matrix.sdk }}\`"
            echo "- **ARCH:** \`${{ env.ARCH }}\`"
            echo "- **Mode:** \`${{ needs.prepare.outputs.mode }}\`"
            echo "- **Artifact name:** \`${{ env.PKG_NAME }}-${{ matrix.version }}\`"
            echo
            echo "### Packages"
            echo
            if [ -d upload ] && [ -n "$(ls -A upload 2>/dev/null || true)" ]; then
              echo "Packages from this job (download the workflow artifact above):"
              echo
              for f in upload/*; do
                echo "- \`$(basename "$f")\`"
              done
            else
              echo "_No packages collected._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
