name: "LuCI CodeQL Analysis"

on:
  push:
    branches: [ "master" ]
    paths:
      - '**/*.js'
      - '**/*.json'
      - '**/*.htm*'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/codeql.config.yml'

  pull_request:
    branches: [ "master" ]
    paths:
      - '**/*.js'
      - '**/*.json'
      - '**/*.htm*'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/codeql.config.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          config-file: ./.github/codeql.config.yml
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

      - name: Job summary
        if: always()
        run: |
          set -euo pipefail
          STATUS="${{ job.status }}"
          case "$STATUS" in
            success) ICON="✅" ;;
            failure) ICON="❌" ;;
            cancelled) ICON="⚠️" ;;
            *) ICON="•" ;;
          esac

          {
            echo "## CodeQL (${{ matrix.language }})"
            echo
            echo "${ICON} **Result:** \`${STATUS}\`"
            echo
            echo "- **Language:** \`${{ matrix.language }}\`"
            echo "- **Config:** \`.github/codeql.config.yml\`"
            if [ "$STATUS" = "success" ]; then
              echo
              echo "Findings (if any) are in the repository **Security** / code scanning alerts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
