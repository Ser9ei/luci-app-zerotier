name: "LuCI ESLint JS/JSON and MD Analysis"

on:
  push:
    branches: [ "master" ]
    paths:
      - '**/*.json'
      - '**/*.js'
      - '**/*.md'

  pull_request:
    branches: [ "master" ]
    paths:
      - '**/*.json'
      - '**/*.js'
      - '**/*.md'

  workflow_dispatch:
    inputs:
      scope:
        description: "Lint scope"
        required: true
        default: all
        type: choice
        options:
          - all
          - changed

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eslint:
    name: ESLint JS/JSON/MD
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: latest

      - name: Install ESLint
        run: npm install --no-audit --no-fund

      - name: Run ESLint
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SCOPE: ${{ inputs.scope }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ZERO_SHA="0000000000000000000000000000000000000000"
          LIST="${RUNNER_TEMP}/eslint-files.list"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SCOPE="$INPUT_SCOPE"
          else
            SCOPE="changed"
          fi

          list_all() {
            git ls-files -z -- '*.js' '*.json' '*.md' ':(exclude)package-lock.json' > "$LIST"
          }

          if [ "$SCOPE" = "all" ]; then
            list_all
          else
            BASE=""
            HEAD=""

            if [ "$EVENT_NAME" = "pull_request" ]; then
              if [ -z "$PR_BASE_SHA" ] || [ -z "$PR_HEAD_SHA" ]; then
                echo "::error::Unable to determine PR base/head SHA."
                exit 1
              fi
              HEAD="$PR_HEAD_SHA"
              BASE="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
            elif [ "$EVENT_NAME" = "push" ]; then
              HEAD="$PUSH_SHA"
              if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$ZERO_SHA" ]; then
                BASE="$PUSH_BEFORE"
              else
                BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
              fi
            else
              HEAD="$(git rev-parse HEAD)"
              BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
            fi

            # The base commit may be missing (e.g. after a force-push): lint everything instead of skipping.
            if [ -n "$BASE" ] && ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              echo "::warning::Base commit ${BASE} is not available — linting all files."
              BASE=""
            fi

            if [ -z "$BASE" ]; then
              list_all
            else
              # Written to a file so that a failing git diff fails the step (not hidden by process substitution).
              git diff --diff-filter=ACMR --name-only -z \
                "$BASE" "$HEAD" -- '*.js' '*.json' '*.md' ':(exclude)package-lock.json' > "$LIST"
            fi
          fi

          mapfile -d '' -t FILES < "$LIST"

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No JS/JSON or MD files to lint"
            {
              echo "## ESLint"
              echo
              echo "_No JS/JSON/MD files to lint._"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Linting files:"
          printf '  %s\n' "${FILES[@]}"

          REPORT="${RUNNER_TEMP}/eslint-report.json"
          ERRLOG="${RUNNER_TEMP}/eslint-stderr.log"
          rm -f "$REPORT" "$ERRLOG"

          # Exit codes: 0 = clean, 1 = lint problems, 2 = ESLint itself failed.
          rc=0
          npx eslint --config .github/eslint.config.mjs \
            --format json --output-file "$REPORT" "${FILES[@]}" 2> "$ERRLOG" || rc=$?

          # Second pass only for the console output and the inline annotations.
          if [ "$rc" -eq 1 ]; then
            npx eslint --config .github/eslint.config.mjs --format gha "${FILES[@]}" || true
          elif [ "$rc" -ne 0 ]; then
            cat "$ERRLOG" >&2
          fi

          {
            echo "## ESLint"
            echo
            echo "Checked **${#FILES[@]}** file(s) (scope: \`${SCOPE}\`)."
            echo

            if [ "$rc" -eq 0 ]; then
              echo "✅ **No problems found.**"
            elif [ "$rc" -eq 1 ] && [ -s "$REPORT" ]; then
              errors="$(jq '[.[].errorCount] | add // 0' "$REPORT")"
              warnings="$(jq '[.[].warningCount] | add // 0' "$REPORT")"
              echo "❌ **${errors} error(s), ${warnings} warning(s).**"
              echo
              echo "<details>"
              echo "<summary>Problems (first 100)</summary>"
              echo
              echo "| Location | Severity | Rule | Message |"
              echo "|---|---|---|---|"
              jq -r --arg root "${GITHUB_WORKSPACE}/" '
                def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;")
                         | gsub("\\|"; "\\|") | gsub("[\r\n]+"; " ");
                .[] | .filePath as $f | .messages[]
                | "| `\($f | ltrimstr($root))`:\(.line // 0):\(.column // 0)"
                  + " | \(if .severity == 2 then "error" else "warning" end)"
                  + " | \(.ruleId // "-")"
                  + " | \(.message | esc) |"' "$REPORT" | head -n 100
              echo
              echo "</details>"
            else
              echo "❌ **ESLint failed to run (exit code ${rc}).**"
              echo
              echo "<details>"
              echo "<summary>Output</summary>"
              echo
              echo '```text'
              # shellcheck disable=SC2016
              tail -n 40 "$ERRLOG" | sed 's/```/` ` `/g' || true
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$rc"
