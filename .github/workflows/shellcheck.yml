name: "ShellCheck (POSIX sh / BusyBox ash)"

on:
  push:
    branches: [ "master" ]
    paths:
      - '**/*.sh'
      - 'root/usr/libexec/rpcd/**'
      - 'root/etc/uci-defaults/**'

  pull_request:
    branches: [ "master" ]
    paths:
      - '**/*.sh'
      - 'root/usr/libexec/rpcd/**'
      - 'root/etc/uci-defaults/**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ShellCheck
        env:
          # CI Variables, example: CI_SHELLCHECK_VERSION=v0.11.0 and CI_SHELLCHECK_SHA256 =8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          SHELLCHECK_VERSION: ${{ vars.CI_SHELLCHECK_VERSION }}
          SHELLCHECK_SHA256: ${{ vars.CI_SHELLCHECK_SHA256 }}
        run: |
          set -euo pipefail

          if ! [[ "${SHELLCHECK_VERSION:-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Variable CI_SHELLCHECK_VERSION must look like v0.11.0 (got '${SHELLCHECK_VERSION:-}')."
            exit 1
          fi
          if ! [[ "${SHELLCHECK_SHA256:-}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Variable CI_SHELLCHECK_SHA256 must be the 64-character lowercase hex SHA-256 of the ${SHELLCHECK_VERSION} linux.x86_64 archive."
            exit 1
          fi

          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          archive_path="${RUNNER_TEMP}/${archive}"

          echo "Downloading ShellCheck ${SHELLCHECK_VERSION}..."
          curl --fail --silent --show-error --location --retry 3 \
            "$url" \
            --output "$archive_path"

          echo "Verifying SHA-256..."
          echo "${SHELLCHECK_SHA256}  ${archive_path}" | sha256sum --check

          echo "Extracting ShellCheck..."
          tar -xJf "$archive_path" -C "$RUNNER_TEMP"

          sudo install \
            "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}/shellcheck" \
            /usr/local/bin/shellcheck

          installed_version="$(
            shellcheck --version |
              awk '/^version:/ { print $2 }'
          )"

          expected_version="${SHELLCHECK_VERSION#v}"

          if [ "$installed_version" != "$expected_version" ]; then
            echo "::error::Expected ShellCheck ${expected_version}, got ${installed_version}"
            exit 1
          fi

          echo "ShellCheck ${installed_version} installed and verified."

      - name: Run ShellCheck
        id: check
        run: |
          set -euo pipefail
          mapfile -d '' -t SH_FILES < <(
            git ls-files -z -- \
              ':(glob)**/*.sh' \
              ':(glob)root/usr/libexec/rpcd/**' \
              ':(glob)root/etc/uci-defaults/**'
          )

          if [ "${#SH_FILES[@]}" -eq 0 ]; then
            echo "files=0" >> "$GITHUB_OUTPUT"
            echo "No shell scripts found."
            exit 0
          fi

          echo "files=${#SH_FILES[@]}" >> "$GITHUB_OUTPUT"
          echo "Checking ${#SH_FILES[@]} script(s):"
          printf '  %s\n' "${SH_FILES[@]}"

          REPORT="${RUNNER_TEMP}/shellcheck.txt"
          rc=0
          shellcheck --shell=busybox "${SH_FILES[@]}" > "$REPORT" 2>&1 || rc=$?
          cat "$REPORT" || true
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          # keep report path for summary
          echo "report=${REPORT}" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Job summary
        if: always()
        env:
          FILES: ${{ steps.check.outputs.files }}
          RC: ${{ steps.check.outputs.rc }}
          REPORT: ${{ steps.check.outputs.report }}
        run: |
          set -euo pipefail
          STATUS="${{ job.status }}"
          case "$STATUS" in
            success) ICON="✅" ;;
            failure) ICON="❌" ;;
            cancelled) ICON="⚠️" ;;
            *) ICON="•" ;;
          esac

          {
            echo "## ShellCheck"
            echo
            echo "${ICON} **Result:** \`${STATUS}\`"
            echo
            if [ "${FILES:-0}" = "0" ]; then
              echo "_No shell scripts found._"
            else
              echo "Checked **${FILES}** file(s) (\`busybox\` dialect)."
              if [ "${RC:-0}" != "0" ] && [ -n "${REPORT:-}" ] && [ -s "$REPORT" ]; then
                echo
                echo "<details>"
                echo "<summary>ShellCheck output</summary>"
                echo
                echo '```text'
                tail -n 80 "$REPORT" | sed 's/```/` ` `/g' || true
                echo '```'
                echo
                echo "</details>"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
