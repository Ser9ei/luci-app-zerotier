name: "LuCI i18n"

on:
  push:
    branches: [ "master" ]
    paths:
      - '**/*.js'
      - '**/*.json'
      - '**/*.htm'
      - '**/*.html'
      - '**/*.lua'
      - '**/*.uc'
      - '**/*.ut'

  pull_request:
    branches: [ "master" ]
    paths:
      - '**/*.js'
      - '**/*.json'
      - '**/*.htm'
      - '**/*.html'
      - '**/*.lua'
      - '**/*.uc'
      - '**/*.ut'

  workflow_dispatch:

concurrency:
  group: i18n-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check i18n
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate variables and LuCI release
        env:
          CI_OPENWRT_SDK_VERSIONS: ${{ vars.CI_OPENWRT_SDK_VERSIONS }}
          CI_PACKAGE: ${{ vars.CI_PACKAGE }}
          CI_PACKAGE_PREFIX: ${{ vars.CI_PACKAGE_PREFIX }}
        run: |
          set -euo pipefail

          pkg="${CI_PACKAGE:-}"
          prefix="${CI_PACKAGE_PREFIX:-}"

          fail=0
          if [ -z "$pkg" ]; then
            echo "::error::GitHub Actions variable CI_PACKAGE is not set (e.g. zerotier)."
            fail=1
          elif ! [[ "$pkg" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "::error::CI_PACKAGE must be lowercase letters, digits, '.', '_', '-' (got '${pkg}')."
            fail=1
          fi

          # The prefix selects the directory in the openwrt/luci tree.
          # Add new package types here (and only here) when they appear.
          case "$prefix" in
            luci-app)   category="applications" ;;
            luci-proto) category="protocols" ;;
            luci-theme) category="themes" ;;
            luci-mod)   category="modules" ;;
            luci-lib)   category="libs" ;;
            "")
              echo "::error::GitHub Actions variable CI_PACKAGE_PREFIX is not set (e.g. luci-app)."
              fail=1
              ;;
            *)
              echo "::error::Unsupported CI_PACKAGE_PREFIX '${prefix}' (supported: luci-app, luci-proto, luci-theme, luci-mod, luci-lib)."
              fail=1
              ;;
          esac
          [ "$fail" -eq 0 ] || exit 1

          # luci.mk names the translation package luci-i18n-<pkg>-<lang>
          # and the template po/templates/<pkg>.pot.
          name="${prefix}-${pkg}"
          dir="${category}/${name}"
          i18n="${pkg}"

          # Same rule as build.yml: the newest numbered release in
          # CI_OPENWRT_SDK_VERSIONS (SNAPSHOT only if nothing else is listed).
          versions="${CI_OPENWRT_SDK_VERSIONS:-}"
          if [ -z "${versions// }" ]; then
            echo "::warning::CI_OPENWRT_SDK_VERSIONS is empty — using LuCI master"
            versions="SNAPSHOT"
          fi

          # shellcheck disable=SC2206
          list=($versions)
          for v in "${list[@]}"; do
            if ! [[ "$v" =~ ^([0-9]+\.[0-9]+\.[0-9]+|SNAPSHOT)$ ]]; then
              echo "::error::Invalid entry '${v}' in CI_OPENWRT_SDK_VERSIONS (expected e.g. 25.12.5 or SNAPSHOT)."
              exit 1
            fi
          done

          last="$(printf '%s\n' "${list[@]}" | { grep -v '^SNAPSHOT$' || true; } | sort -V | tail -n1)"
          last="${last:-SNAPSHOT}"

          if [ "$last" = "SNAPSHOT" ]; then
            ref="master"
          else
            ref="openwrt-${last%.*}"
          fi
          echo "Newest release in CI_OPENWRT_SDK_VERSIONS: ${last} -> LuCI branch ${ref}"

          if ! git ls-remote --exit-code --heads \
            https://github.com/openwrt/luci.git \
            "refs/heads/${ref}" >/dev/null; then
            echo "::error::LuCI branch '${ref}' does not exist or cannot be accessed."
            exit 1
          fi
          echo "Validated LuCI branch: ${ref}"

          {
            echo "PKG_NAME=${name}"
            echo "PKG_DIR=${dir}"
            echo "I18N_PREFIX=${i18n}"
            echo "POT_FILE=${dir}/po/templates/${i18n}.pot"
            echo "LUCI_REF=${ref}"
          } >> "$GITHUB_ENV"

          echo "PKG_NAME=${name} PKG_DIR=${dir} I18N_PREFIX=${i18n}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.PKG_DIR }}

      - name: Install gettext and Perl dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            gettext \
            perl \
            libtext-balanced-perl

      - name: Checkout LuCI i18n tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openwrt/luci
          ref: ${{ env.LUCI_REF }}
          path: luci
          sparse-checkout: |
            build/i18n-scan.pl
            build/i18n-update.pl
            luci.mk

      - name: Generate POT
        run: |
          set -euo pipefail

          test -f "${POT_FILE}"

          mkdir -p .i18n

          perl luci/build/i18n-scan.pl "${PKG_DIR}" > .i18n/generated.pot

          echo "Generated POT:"
          wc -l .i18n/generated.pot

          echo "Repository POT:"
          wc -l "${POT_FILE}"

      - name: Compare POT
        id: compare_pot
        run: |
          set -euo pipefail

          test -f "${POT_FILE}"
          test -f ".i18n/generated.pot"

          if cmp -s "${POT_FILE}" ".i18n/generated.pot"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "POT is up to date."

            {
              echo "## POT check"
              echo
              echo "✅ **POT is up to date.**"
              echo
              echo "Repository and generated POT files are identical."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          diff -u "${POT_FILE}" ".i18n/generated.pot" > ".i18n/${I18N_PREFIX}.pot.diff" || true

          echo "::warning::Translation template is not up to date."

          {
            echo "## POT check"
            echo
            echo "⚠️ **POT is not up to date.**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show POT diff
        if: steps.compare_pot.outputs.changed == 'true'
        run: |
          set -euo pipefail

          echo "::group::POT diff"
          cat ".i18n/${I18N_PREFIX}.pot.diff"
          echo "::endgroup::"

          {
            echo
            echo "### POT update required"
            echo
            echo "<details>"
            echo "<summary>Show POT diff</summary>"
            echo
            echo '```diff'
            cat ".i18n/${I18N_PREFIX}.pot.diff"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select PO files
        run: |
          set -euo pipefail

          find "${PKG_DIR}/po" -type f -name '*.po' -print | sort > .i18n/files

          if [ ! -s .i18n/files ]; then
            echo "::error::No PO files found."
            exit 1
          fi

          echo "PO files:"
          cat .i18n/files

      - name: Validate PO syntax
        run: |
          set -euo pipefail

          while IFS= read -r file; do
            echo "Checking $file"
            msgfmt --check --check-format --output-file=/dev/null "$file"
          done < .i18n/files

      - name: Synchronize PO files
        run: |
          set -euo pipefail

          rm -rf po-work

          cp -a "${PKG_DIR}/po" po-work
          cp ".i18n/generated.pot" "po-work/templates/${I18N_PREFIX}.pot"

          echo "Synchronizing PO files..."

          perl luci/build/i18n-update.pl "${GITHUB_WORKSPACE}/po-work"

      - name: Compare PO files
        id: compare_po
        run: |
          set -euo pipefail

          mkdir -p .i18n/diff

          changed=false

          while IFS= read -r file; do
            rel="${file#"${PKG_DIR}"/po/}"
            work="po-work/${rel}"
            diff_file=".i18n/diff/${rel}.diff"

            mkdir -p "$(dirname "$diff_file")"

            if cmp -s "$file" "$work"; then
              echo "No changes: $file"
            else
              diff -u --label "a/${rel}" --label "b/${rel}" "$file" "$work" > "$diff_file" || true
              echo "Changed: $file"
              changed=true
            fi
          done < .i18n/files

          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      - name: Generate PO statistics
        run: |
          set -euo pipefail

          # stat <msgfmt output> <word>: number in front of "<word>", or 0.
          stat() {
            local n
            n="$(sed -nE "s/.*\b([0-9]+) $2.*/\1/p" <<<"$1" | head -n1)"
            echo "${n:-0}"
          }

          {
            echo "## PO statistics"
            echo
            echo "| File | Total | Translated | Untranslated | Fuzzy |"
            echo "|---|---:|---:|---:|---:|"

            while IFS= read -r file; do
              out="$(LC_ALL=C msgfmt --statistics --output-file=/dev/null "$file" 2>&1)"
              translated="$(stat "$out" translated)"
              untranslated="$(stat "$out" untranslated)"
              fuzzy="$(stat "$out" fuzzy)"
              total=$((translated + untranslated + fuzzy))

              rel="${file#"${PKG_DIR}"/po/}"
              echo "| \`${rel}\` | ${total} | ${translated} | ${untranslated} | ${fuzzy} |"
            done < .i18n/files
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show PO diff
        if: steps.compare_po.outputs.changed == 'true'
        run: |
          set -euo pipefail

          {
            echo
            echo "## PO update required"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r file; do
            rel="${file#"${PKG_DIR}"/po/}"
            diff_file=".i18n/diff/${rel}.diff"

            if [ -f "$diff_file" ]; then
              echo "::group::PO diff: ${rel}"
              cat "$diff_file"
              echo "::endgroup::"

              {
                echo "### ${rel}"
                echo
                echo "<details>"
                echo "<summary>Show diff</summary>"
                echo
                echo '```diff'
                cat "$diff_file"
                echo '```'
                echo
                echo "</details>"
                echo
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done < .i18n/files

          echo "::warning::PO catalogues are not up to date."

      - name: Show PO status
        if: steps.compare_po.outputs.changed == 'false'
        run: |
          set -euo pipefail

          {
            echo
            echo "## PO check"
            echo
            echo "✅ **PO catalogues are up to date.**"
            echo
            echo "All selected PO files are synchronized with the generated POT."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "PO catalogues are up to date."

      - name: Prepare i18n update artifact
        if: steps.compare_pot.outputs.changed == 'true' || steps.compare_po.outputs.changed == 'true'
        env:
          POT_CHANGED: ${{ steps.compare_pot.outputs.changed }}
        run: |
          set -euo pipefail

          rm -rf i18n-update
          mkdir -p i18n-update/po/templates

          if [ "$POT_CHANGED" = "true" ]; then
            cp ".i18n/generated.pot" \
              "i18n-update/po/templates/${I18N_PREFIX}.pot"
          fi

          while IFS= read -r file; do
            rel="${file#"${PKG_DIR}"/po/}"
            work="po-work/${rel}"

            if [ -f ".i18n/diff/${rel}.diff" ]; then
              mkdir -p "i18n-update/po/$(dirname "$rel")"
              cp "$work" "i18n-update/po/${rel}"
            fi
          done < .i18n/files

          echo "i18n update artifact:"
          find i18n-update -type f -print | sort

      - name: Upload i18n update
        if: steps.compare_pot.outputs.changed == 'true' || steps.compare_po.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.I18N_PREFIX }}-i18n-update
          path: i18n-update/
          if-no-files-found: error
          retention-days: 7

      - name: Fail if i18n is out of date
        if: >
          steps.compare_pot.outputs.changed == 'true' ||
          steps.compare_po.outputs.changed == 'true'
        env:
          POT_CHANGED: ${{ steps.compare_pot.outputs.changed }}
          PO_CHANGED: ${{ steps.compare_po.outputs.changed }}
        run: |
          set -euo pipefail

          if [ "$POT_CHANGED" = "true" ] && [ "$PO_CHANGED" = "true" ]; then
            status="POT and PO catalogues are not up to date"
          elif [ "$POT_CHANGED" = "true" ]; then
            status="POT is not up to date"
          else
            status="PO catalogues are not up to date"
          fi

          echo "::error::${status}."

          {
            echo
            echo "## i18n check result"
            echo
            echo "❌ **${status}.**"
            echo
            echo "Download the **${I18N_PREFIX}-i18n-update** artifact and replace the affected files."
          } >> "$GITHUB_STEP_SUMMARY"

          exit 1
