version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: "ci [dependabot]"
    groups:
      actions:
        patterns:
          - "*"

  # Maintain npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: "npm [dependabot]"
    groups:
      eslint:
        patterns:
          - "*"
